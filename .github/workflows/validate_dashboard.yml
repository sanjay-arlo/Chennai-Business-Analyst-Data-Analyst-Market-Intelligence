name: Validate dashboard

on:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'scripts/validate_dashboard.py'
      - '.github/workflows/validate_dashboard.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'scripts/validate_dashboard.py'
      - '.github/workflows/validate_dashboard.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate dashboard files
        run: python scripts/validate_dashboard.py
